# Kit maintenance: when someone pushes a learning/* branch, open a pull request automatically
# so the maintainer is notified by GitHub. Removed from projects by SETUP.md.
name: learning-pr
on:
  push:
    branches: ['learning/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR already open"; exit 0
          fi
          title=$(git log -1 --format=%s)
          gh pr create --base main --head "$BRANCH" --title "$title" \
            --body "Opened automatically for review. Check: no project/company details, evidence and applicability stated (see promote-learning skill), kit-check green."
